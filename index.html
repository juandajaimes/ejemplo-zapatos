<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PASO – Tienda de zapatos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap">
<style>
:root{--bg:#f2f4f7;--ink:#14161c;--mut:#5d6472;--card:#fff;--line:#dfe3ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141a;--ink:#f2f4f7;--mut:#9aa2b1;--card:#1c1f27;--line:#2c313c}}
:root[data-theme="dark"]{--bg:#12141a;--ink:#f2f4f7;--mut:#9aa2b1;--card:#1c1f27;--line:#2c313c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid #3a86ff;outline-offset:2px}
.pad{padding-left:clamp(16px,4vw,48px);padding-right:clamp(16px,4vw,48px)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;padding-top:12px;padding-bottom:12px;background:var(--bg)}
.logo{font-weight:800;font-size:22px;letter-spacing:.04em}
.cbtn{display:flex;gap:8px;align-items:center;background:var(--ink);color:var(--bg);border:0;border-radius:99px;padding:10px 18px;font-weight:800;cursor:pointer}
.cbtn i{font-style:normal;background:#ffb703;color:#14161c;border-radius:99px;min-width:24px;padding:1px 7px;text-align:center}
.hero{border-radius:32px;background:#ffb703;color:#14161c;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:8px;padding:clamp(20px,4vw,44px);overflow:hidden}
.hero h1{margin:0;font-size:clamp(40px,8vw,96px);line-height:.9;letter-spacing:-.04em;font-weight:800}
.hero p{margin:14px 0 18px;font-weight:500;font-size:clamp(15px,2vw,19px)}
.hero a{display:inline-block;background:#14161c;color:#fff;text-decoration:none;font-weight:800;border-radius:99px;padding:12px 22px}
.hero svg{width:118%;height:auto;transform:rotate(-8deg)}
@media(max-width:640px){.hero{grid-template-columns:1fr}.hero svg{width:100%}}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:clamp(28px,5vw,52px) 0 16px}
.chips button{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:8px 18px;font-weight:800;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:14px}
.card{background:var(--card);border-radius:26px;overflow:hidden;display:flex;flex-direction:column}
.pic{background:var(--c);aspect-ratio:4/3;display:grid;place-items:center}
.pic svg{width:86%;height:auto}
.info{padding:14px 16px 16px;display:grid;gap:10px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.name{font-weight:800;font-size:21px}
.kind{color:var(--mut);font-size:14px}
select,input{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:11px 12px}
select.err{border-color:#e63946}
.add{background:var(--ink);color:var(--bg);border:0;border-radius:99px;padding:12px 18px;font-weight:800;cursor:pointer;width:100%}
.lnk{background:none;border:0;color:var(--mut);text-decoration:underline;cursor:pointer;padding:6px}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.shade.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;right:0;width:min(440px,100%);background:var(--bg);z-index:21;transform:translateX(100%);transition:transform .3s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:-10px 0 40px rgba(0,0,0,.25)}
.drawer.open{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1.5px solid var(--line)}
.dh h2{margin:0;font-size:24px;font-weight:800}
.dh button{background:none;border:0;font-size:28px;cursor:pointer;line-height:1}
#dbody{padding:16px 20px 24px;overflow-y:auto;display:grid;gap:14px;align-content:start}
.items{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.it{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center;background:var(--card);border-radius:18px;padding:10px}
.th{background:var(--c);border-radius:12px;display:grid;place-items:center;aspect-ratio:1}
.th svg{width:94%;height:auto}
.q{display:flex;gap:10px;align-items:center;margin-top:6px}
.q button{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;font-weight:800}
.ct{text-align:right;display:grid;gap:4px}
.sum{margin:0;display:grid;gap:6px}
.sum div{display:flex;justify-content:space-between}
.sum dt{color:var(--mut)}.sum dd{margin:0;font-weight:500}
.sum .tot{border-top:1.5px solid var(--line);padding-top:10px;font-size:20px;font-weight:800}
.sum .tot dt{color:var(--ink)}
#co{display:grid;gap:12px}
#co label{display:grid;gap:4px;font-size:14px;color:var(--mut)}
.msg{text-align:center;padding:28px 8px;display:grid;gap:12px}
.msg h3{margin:0;font-size:26px}
.msg p{margin:0}
footer{padding-top:32px;padding-bottom:36px;color:var(--mut);font-size:14px}
@media (prefers-reduced-motion:reduce){.shade,.drawer{transition:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="sneaker" viewBox="0 0 300 180">
<ellipse cx="152" cy="152" rx="132" ry="7" fill="#000" opacity=".16"/>
<path d="M22 112C19 90 22 66 30 54C35 47 45 46 55 50C67 56 79 67 93 65L121 53C150 45 179 61 201 77C233 85 269 93 285 105C293 111 292 113 291 115L22 114Z" fill="var(--body)"/>
<path d="M85 67C82 48 91 33 105 32C113 32 119 41 117 53L101 67Z" fill="var(--accent2)"/>
<path d="M46 104C90 101 132 80 178 93C142 110 92 114 46 110Z" fill="var(--accent)"/>
<path d="M20 70H31V106H21Z" fill="var(--accent)"/>
<path d="M126 54l9 15M143 57l9 15M160 61l9 15M177 67l9 14M193 74l8 13" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
<path d="M252 96C270 100 285 106 291 113L250 113Z" fill="#fff" opacity=".4"/>
<path d="M14 113H292C293 128 285 142 268 142H40C22 142 14 130 14 113Z" fill="var(--sole)"/>
<path d="M16 127H291" stroke="#000" stroke-opacity=".18" stroke-width="3"/>
</symbol>
<symbol id="boot" viewBox="0 0 300 180">
<ellipse cx="172" cy="177" rx="126" ry="3.5" fill="#000" opacity=".16"/>
<path d="M62 14H142L150 92C182 96 232 100 266 122C286 132 291 146 289 152H58Z" fill="var(--body)"/>
<path d="M62 14H142L143 32H63Z" fill="var(--accent)"/>
<path d="M63 60H146L147 76H64Z" fill="var(--accent)"/>
<rect x="108" y="57" width="18" height="22" rx="4" fill="var(--accent2)"/>
<path d="M228 112C258 118 284 132 289 152H236Z" fill="#000" opacity=".16"/>
<path d="M54 148H291V160Q291 168 280 168H104V176H54Z" fill="var(--sole)"/>
</symbol>
<symbol id="loafer" viewBox="0 0 300 180">
<g transform="translate(0,-18)">
<ellipse cx="152" cy="150" rx="132" ry="6" fill="#000" opacity=".16"/>
<path d="M22 112C20 88 38 74 66 76C96 78 118 70 150 76C200 80 250 92 280 108C292 116 291 124 282 128H30C23 128 21 122 22 112Z" fill="var(--body)"/>
<path d="M112 80C138 86 168 84 194 90L190 108C166 102 138 104 108 96Z" fill="var(--accent)"/>
<path d="M138 90H160V99H138Z" fill="var(--body)"/>
<path d="M20 126H290C291 138 284 146 270 146H36C24 146 19 138 20 126Z" fill="var(--sole)"/>
<path d="M22 135H289" stroke="#000" stroke-opacity=".2" stroke-width="3"/>
</g>
</symbol>
</defs></svg>

<header class="top pad"><span class="logo">PASO</span><button class="cbtn" id="cartBtn" aria-label="Abrir carrito">Carrito <i id="cnt">0</i></button></header>

<main class="pad">
  <section class="hero">
    <div><h1>Camina distinto.</h1><p>Envío gratis en compras desde $ 250.000</p><a href="#tienda">Ver zapatos</a></div>
    <div id="heroImg"></div>
  </section>
  <div class="chips" id="chips" role="group" aria-label="Filtrar por tipo"></div>
  <section class="grid" id="tienda"></section>
</main>
<footer class="pad">PASO · Tienda de demostración</footer>

<div class="shade" id="shade"></div>
<aside class="drawer" id="drawer" aria-label="Carrito de compras" aria-hidden="true">
  <div class="dh"><h2>Tu carrito</h2><button id="closeBtn" aria-label="Cerrar carrito">×</button></div>
  <div id="dbody"></div>
</aside>

<script>
// nombre, tipo, cuerpo, suela, acento, acento2, fondo, precio
const P=[
["Nube","sneaker","#e63946","#f1faee","#1d3557","#f1faee","#ffe1e3",189900],
["Ruta","boot","#8d5a2b","#2b1d10","#d9a066","#f4e3c8","#f3e2cc",329900],
["Alba","loafer","#1f2a44","#0e1424","#d4a72c","#d4a72c","#dbe3f5",259900],
["Menta","sneaker","#2a9d8f","#ffffff","#264653","#e9c46a","#d5f2ee",199900],
["Sol","sneaker","#ffb703","#ffffff","#14161c","#14161c","#fff0c2",179900],
["Roble","boot","#2f2f35","#f0ece4","#ff6b35","#ffffff","#e4e4ea",349900],
["Bruma","loafer","#b58bd9","#4a2c66","#f5e6ff","#f5e6ff","#efe3fa",239900],
["Coral","sneaker","#ff7f50","#fff7ed","#7b2d26","#fff7ed","#ffe4d6",194900],
["Cielo","sneaker","#4cc9f0","#ffffff","#3a0ca3","#ffffff","#d9f3fc",204900]
];
const TIPOS={sneaker:"Tenis",boot:"Botas",loafer:"Mocasines"};
const TALLAS=[36,37,38,39,40,41,42,43,44];
const $=s=>document.querySelector(s);
const fmt=n=>"$ "+n.toLocaleString("es-CO");
const svg=(p,c="")=>`<svg class="${c}" viewBox="0 0 300 180" role="img" aria-label="Zapato ${p[0]}" style="--body:${p[2]};--sole:${p[3]};--accent:${p[4]};--accent2:${p[5]}"><use href="#${p[1]}"/></svg>`;

let filtro="Todos",view="cart",orden=0,cart=[];
try{cart=JSON.parse(localStorage.getItem("paso-cart")||"[]")}catch(e){cart=[]}
if(!Array.isArray(cart))cart=[];
cart=cart.filter(c=>c&&P[c.i]&&c.q>0&&TALLAS.includes(Number(c.t)));
const save=()=>{try{localStorage.setItem("paso-cart",JSON.stringify(cart))}catch(e){}};

$("#heroImg").innerHTML=svg(["Nube","sneaker","#e63946","#ffffff","#14161c","#ffffff"]);

function renderChips(){
  $("#chips").innerHTML=["Todos",...Object.values(TIPOS)].map(t=>`<button data-f="${t}" aria-pressed="${t===filtro}">${t}</button>`).join("");
}
function renderGrid(){
  $("#tienda").innerHTML=P.map((p,i)=>({p,i})).filter(({p})=>filtro==="Todos"||TIPOS[p[1]]===filtro).map(({p,i})=>
  `<article class="card"><div class="pic" style="--c:${p[6]}">${svg(p)}</div><div class="info"><div class="row"><span class="name">${p[0]}</span><span>${fmt(p[7])}</span></div><div class="kind">${TIPOS[p[1]]}</div><select id="t${i}" aria-label="Talla de ${p[0]}"><option value="">Elige tu talla</option>${TALLAS.map(t=>`<option>${t}</option>`).join("")}</select><button class="add" data-add="${i}">Agregar al carrito</button></div></article>`).join("");
}
const subtotal=()=>cart.reduce((s,c)=>s+P[c.i][7]*c.q,0);

function renderCart(){
  $("#cnt").textContent=cart.reduce((s,c)=>s+c.q,0);
  const sub=subtotal(),env=(sub===0||sub>=250000)?0:12000,tot=sub+env;
  let h="";
  if(view==="done"){
    h=`<div class="msg"><h3>¡Pedido recibido!</h3><p>Pedido n.º ${orden}. Te enviaremos la confirmación al correo que indicaste.</p><p class="kind">Esto es una demostración: no se hizo ningún cobro real.</p><button class="add" data-go="close">Seguir comprando</button></div>`;
  }else if(!cart.length){
    h=`<div class="msg"><h3>Tu carrito está vacío</h3><p>Elige un par y una talla para empezar.</p><button class="add" data-go="close">Ver zapatos</button></div>`;
  }else{
    const sum=`<dl class="sum"><div><dt>Subtotal</dt><dd>${fmt(sub)}</dd></div><div><dt>Envío</dt><dd>${env?fmt(env):"Gratis"}</dd></div><div class="tot"><dt>Total</dt><dd>${fmt(tot)}</dd></div></dl>`;
    if(view==="checkout"){
      h=`<form id="co"><label>Nombre completo<input name="n" required autocomplete="name"></label><label>Correo<input name="e" type="email" required autocomplete="email"></label><label>Dirección de entrega<input name="d" required autocomplete="street-address"></label><label>Ciudad<input name="c" required autocomplete="address-level2"></label><p class="kind">Pagas al recibir tu pedido.</p>${sum}<button class="add" type="submit">Confirmar pedido</button><button type="button" class="lnk" data-go="cart">Volver al carrito</button></form>`;
    }else{
      h=`<ul class="items">${cart.map((c,k)=>{const p=P[c.i];return `<li class="it"><div class="th" style="--c:${p[6]}">${svg(p)}</div><div><b>${p[0]}</b><div class="kind">Talla ${c.t} · ${fmt(p[7])}</div><div class="q"><button data-q="${k}" data-d="-1" aria-label="Quitar una unidad">−</button><span>${c.q}</span><button data-q="${k}" data-d="1" aria-label="Agregar una unidad">+</button></div></div><div class="ct"><b>${fmt(p[7]*c.q)}</b><button class="lnk" data-rm="${k}">Quitar</button></div></li>`}).join("")}</ul>${sum}<button class="add" data-go="checkout">Finalizar compra</button>`;
    }
  }
  $("#dbody").innerHTML=h;
}
function openCart(v){
  if(v)view=v;
  renderCart();
  $("#drawer").classList.add("open");$("#shade").classList.add("open");
  $("#drawer").setAttribute("aria-hidden","false");
  $("#closeBtn").focus();
}
function closeCart(){
  $("#drawer").classList.remove("open");$("#shade").classList.remove("open");
  $("#drawer").setAttribute("aria-hidden","true");
  if(view==="done"||view==="checkout")view="cart";
  renderCart();
}

$("#chips").addEventListener("click",e=>{
  const b=e.target.closest("[data-f]");if(!b)return;
  filtro=b.dataset.f;renderChips();renderGrid();
});
$("#tienda").addEventListener("click",e=>{
  const b=e.target.closest("[data-add]");if(!b)return;
  const i=Number(b.dataset.add),sel=$("#t"+i);
  if(!sel.value){sel.classList.add("err");sel.focus();return}
  sel.classList.remove("err");
  const t=sel.value,f=cart.find(c=>c.i===i&&String(c.t)===t);
  if(f)f.q++;else cart.push({i,t,q:1});
  save();renderCart();
  b.textContent="¡Agregado!";
  setTimeout(()=>{b.textContent="Agregar al carrito"},1200);
});
$("#tienda").addEventListener("change",e=>{if(e.target.matches("select"))e.target.classList.remove("err")});
$("#dbody").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.q!==undefined){
    const c=cart[b.dataset.q];c.q+=Number(b.dataset.d);
    if(c.q<1)cart.splice(b.dataset.q,1);
    save();renderCart();
  }else if(b.dataset.rm!==undefined){
    cart.splice(b.dataset.rm,1);save();renderCart();
  }else if(b.dataset.go){
    if(b.dataset.go==="close")closeCart();
    else{view=b.dataset.go;renderCart()}
  }
});
$("#dbody").addEventListener("submit",e=>{
  e.preventDefault();
  orden=Math.floor(1000+Math.random()*9000);
  cart=[];save();view="done";renderCart();
});
$("#cartBtn").addEventListener("click",()=>openCart(cart.length?"cart":"cart"));
$("#closeBtn").addEventListener("click",closeCart);
$("#shade").addEventListener("click",closeCart);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeCart()});

renderChips();renderGrid();renderCart();
</script>
</body>
</html>
